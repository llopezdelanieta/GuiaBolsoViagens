<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia de Bolso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <main class="app-shell">
    <section class="app-card" aria-live="polite">
      <div class="topbar">
        <div class="header-copy">
          <span class="eyebrow">Tech travel exchange</span>
          <h1>Guia de Bolso</h1>
        </div>

        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Alternar tema">
          <span id="themeToggleIcon" class="theme-toggle__icon" aria-hidden="true">☀</span>
        </button>
      </div>

      <div class="panel-header">
        <span class="panel-badge">Tempo real</span>
        <div class="quote-summary">
          <span id="exchangeRate" title="Cotação usada">--</span>
          <span class="quote-summary__updated">Atualizado em <span id="lastUpdated">--</span></span>
          <span id="statusText" class="status-text" role="status">Pronto para consultar</span>
        </div>
      </div>

      <div class="flag-section">
        <button id="destinationToggle" class="destination-toggle" data-currency="ARS" type="button" aria-expanded="false" aria-controls="destinationFlags">
          <span class="section-label">Destino</span>
          <span id="selectedCountry">Argentina</span>
          <span class="destination-toggle__arrow" aria-hidden="true">⌄</span>
        </button>
        <div id="destinationFlags" class="flag-grid" role="group" aria-label="Selecione o país de destino" hidden>
          <button class="flag-card is-active" type="button" data-currency="ARS" aria-pressed="true" aria-label="Argentina">
            <img class="flag-card__flag" src="imagens/argentina.png" alt="" aria-hidden="true">
            <span class="flag-card__name">Argentina</span>
          </button>
          <button class="flag-card" type="button" data-currency="USD" aria-pressed="false" aria-label="Estados Unidos">
            <img class="flag-card__flag" src="imagens/estados-unidos.png" alt="" aria-hidden="true">
            <span class="flag-card__name">Estados Unidos</span>
          </button>
          <button class="flag-card" type="button" data-currency="CAD" aria-pressed="false" aria-label="Canadá">
            <img class="flag-card__flag" src="imagens/canada.png" alt="" aria-hidden="true">
            <span class="flag-card__name">Canadá</span>
          </button>
          <button class="flag-card" type="button" data-currency="GBP" aria-pressed="false" aria-label="Reino Unido">
            <img class="flag-card__flag" src="imagens/inglaterra.png" alt="" aria-hidden="true">
            <span class="flag-card__name">Reino Unido</span>
          </button>
          <button class="flag-card" type="button" data-currency="EUR" aria-pressed="false" aria-label="Espanha">
            <img class="flag-card__flag" src="imagens/espanha.png" alt="" aria-hidden="true">
            <span class="flag-card__name">Espanha</span>
          </button>
        </div>
      </div>

      <form class="converter-form" id="converterForm">
        <div class="currency-fields">
        <label class="field" id="localCurrencyField">
          <span id="targetAmountLabel">Valor em ARS</span>
          <input
            id="targetAmount"
            name="targetAmount"
            type="text"
            inputmode="decimal"
            placeholder="Ex.: 25.000,00"
            value="1.000,00"
          >
        </label>

        <label class="field" id="brlCurrencyField">
          <span>Valor em real (BRL)</span>
          <input
            id="amount"
            name="amount"
            type="text"
            inputmode="decimal"
            placeholder="Ex.: 1.500,00"
          >
        </label>
        <button id="swapCurrencies" class="swap-currencies" type="button" aria-label="Inverter a posição dos campos de moeda" title="Inverter campos">
          <svg class="swap-currencies__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M8 19V5m-4 4 4-4 4 4" />
            <path d="M16 5v14m-4-4 4 4 4-4" />
          </svg>
        </button>
        </div>
        <div id="numericKeypad" class="numeric-keypad" role="group" aria-label="Teclado numérico para os valores das moedas">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="clear" aria-label="Zerar os dois valores">C</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="backspace" aria-label="Apagar último dígito">⌫</button>
        </div>
      </form>

      <div id="loadingMessage" class="feedback feedback--loading" hidden>
        Carregando cotação mais recente...
      </div>

      <div id="errorMessage" class="feedback feedback--error" hidden role="alert">
        Não foi possível buscar a cotação agora. Tente novamente em instantes.
      </div>


      <button id="retryButton" class="retry-button" type="button">
        Atualizar cotação
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
